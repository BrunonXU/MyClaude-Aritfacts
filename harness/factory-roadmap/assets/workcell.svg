  <mask id="grid-mask"><ellipse cx="378" cy="305" rx="440" ry="125" fill="url(#floor-mask)"/></mask>
  <filter id="blur" x="-.3" y="-.7" width="1.6" height="2.4"><feGaussianBlur stdDeviation="5"/></filter>
  <g id="pile" stroke-linecap="round" stroke-linejoin="round">
