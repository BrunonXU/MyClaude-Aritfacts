  <linearGradient id="metal" x1="0" x2=".84" y1=".08" y2="1"><stop stop-color="#fefefe"/><stop offset=".55" stop-color="#eef3f7"/><stop offset="1" stop-color="#c1ceda"/></linearGradient>
  <linearGradient id="dark" x1="0" x2=".95" y1="0" y2="1"><stop stop-color="#60778a"/><stop offset="1" stop-color="#263c50"/></linearGradient>
  <linearGradient id="blue-face" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e1f0fc"/><stop offset="1" stop-color="#c5dff4"/></linearGradient>
  <linearGradient id="shade" x1="0" x2=".78" y1="0" y2="1"><stop stop-color="#b5c5d3"/><stop offset="1" stop-color="#dfebf2"/></linearGradient>
  <linearGradient id="foam" x1="0" x2=".65" y1="0" y2="1"><stop stop-color="white"/><stop offset=".6" stop-color="#f4fbfd"/><stop offset="1" stop-color="#d9e8f0"/></linearGradient>
