<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="wc-title wc-desc">
<title id="wc-title">九宫格工位的取料与放置路线</title>
<desc id="wc-desc">左侧三行三列的料架中有成叠的泡沫纸，轮式机械臂从中央一格抓取。右侧是放置区，地面蓝色实线标明运送方向，虚线标明返回料架的方向。</desc>
<defs>
