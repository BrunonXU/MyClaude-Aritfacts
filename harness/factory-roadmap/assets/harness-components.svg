<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 376" width="1160" height="376" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">F1 Harness 目标架构的算法组件与信息流</title>
<desc id="desc">SAM 分割、深度相机和夹爪 CAN 形成状态估计。PyRUA 运行任务程序，经 RPent 调用技能；IK 与 OMPL 生成轨迹，可选学习策略为待接入项。F1 Owner 执行安全检查并统一发布动作，Ruckig 平滑关节运动。执行回执和新的观测反馈至下一轮。局部恢复用尽时 Astra 返回策略，记录的修复经过独立验证再冻结复用。</desc>
<defs>
 <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5 1.5l6 3-6 3" fill="none" stroke="#47647a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5 1.5l6 3-6 3" fill="none" stroke="#195ba2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
  text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3f}.tit{font-size:22px;font-weight:700}.mid{font-size:18px;font-weight:650}.body{font-size:16px;fill:#445b70}.hi{font-size:15px;font-weight:600;fill:#195ba2}.a{fill:none;stroke:#47647a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.b{fill:none;stroke:#195ba2;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#b)}.ico{fill:none;stroke:#195ba2;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.row{stroke:#d4dce4;stroke-width:1}
 </style>
</defs>
<rect width="1160" height="376" fill="#fff"/>
<!-- Escalation and independently validated reuse both enter the program, never the actuator. -->
<g><rect x="18" y="14" width="458" height="63" rx="5" fill="#edf4fa" stroke="#b2c8db"/>
 <g class="ico" transform="translate(35 34)"><path d="M1 1h17v13H9l-5 4v-4H1z"/><path d="M5 6h9m-9 4h6"/></g>
 <text x="68" y="53" class="mid">Astra 异常恢复</text><text x="226" y="53" class="body">局部重试用尽后提出新策略</text>
</g>
<g><rect x="560" y="14" width="581" height="63" rx="5" fill="#f6f8fa" stroke="#c4cfd8"/>
 <g class="ico" transform="translate(578 35)"><path d="M1 2h7l3 3h9v13H1z"/><path d="m7 11 3 3 6-6"/></g>
 <text x="610" y="53" class="mid">经验复用</text><text x="715" y="53" class="body">记录解法</text><path class="a" d="M791 47h16"/><text x="819" y="53" class="body">独立验证</text><path class="a" d="M895 47h16"/><text x="925" y="53" class="body">冻结为可调用程序</text>
</g>
<path class="b" d="M367 81v43" marker-start="url(#b)"/><text x="382" y="104" class="hi">请求 / 策略</text>
<path class="b" d="M667 78v24H493v23" stroke-dasharray="5 4"/>
<!-- Main execution pipeline -->
<path class="a" d="M245 212h35"/><path class="a" d="M517 212h35"/><path class="a" d="M829 212h35"/>
<g>
 <rect x="18" y="128" width="224" height="169" rx="6" fill="#f8fafb" stroke="#9db0c0"/>
 <rect x="18" y="128" width="224" height="48" rx="6" fill="#e7edf2"/><path d="M18 170h224v6H18z" fill="#e7edf2"/>
 <text x="36" y="161" class="tit">状态感知</text>
 <text x="36" y="205" class="mid">SAM 分割＋深度相机</text>
 <text x="36" y="232" class="body">定位物料、障碍与抓点</text>
 <path class="row" d="M36 247h188"/>
 <text x="36" y="274" class="body">夹爪 CAN 反馈夹持状态</text>
</g>
<g>
 <rect x="284" y="128" width="231" height="169" rx="6" fill="#f2f7fb" stroke="#829eb7"/>
 <rect x="284" y="128" width="231" height="48" rx="6" fill="#dceaf6"/><path d="M284 170h231v6H284z" fill="#dceaf6"/>
 <text x="302" y="161" class="tit">任务编排</text>
 <text x="302" y="205" class="mid">PyRUA 运行任务程序</text>
 <text x="302" y="232" class="body">选择技能、分支与重试</text>
 <path class="row" d="M302 247h195"/>
 <text x="302" y="274" class="body">通过 RPent 调用技能</text>
</g>
<g>
 <rect x="557" y="128" width="270" height="169" rx="6" fill="#f8fafb" stroke="#9db0c0"/>
 <rect x="557" y="128" width="270" height="48" rx="6" fill="#e7edf2"/><path d="M557 170h270v6H557z" fill="#e7edf2"/>
 <text x="575" y="161" class="tit">技能与运动规划</text>
 <text x="575" y="205" class="mid">IK 求解 · OMPL 搜索</text>
 <text x="575" y="232" class="body">生成并检查候选路径</text>
 <path class="row" d="M575 247h234"/>
 <text x="575" y="274" class="body">π0.5 / RLT 学习策略</text>
 <rect x="744" y="254" width="69" height="26" rx="4" fill="white" stroke="#8ca9c3" stroke-dasharray="3 2"/><text x="778" y="272" text-anchor="middle" class="hi">待接入</text>
</g>
<g>
 <rect x="869" y="128" width="272" height="169" rx="6" fill="#193249"/>
 <path d="M870 176h270" stroke="#547087"/>
 <text x="887" y="161" class="tit" style="fill:white">安全内核</text>
 <text x="887" y="205" class="mid" style="fill:white">F1 Owner 统一发布动作</text>
 <text x="887" y="232" class="body" style="fill:#e2edf5">复核授权、限位与碰撞</text>
 <path d="M887 247h236" stroke="#506a7f"/>
 <text x="887" y="274" class="body" style="fill:#e2edf5">Ruckig 平滑关节运动</text>
</g>
<!-- Feedback is routed below the action flow, physically separate from planning. -->
